name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (PHP + JS syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax check
        run: |
          find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 -P4 php -l

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS syntax check
        run: |
          find . -name "*.js" -not -path "./vendor/*" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 -P4 node --check

  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: pk_ams_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: pk_ams_test
          DB_USER: root
          DB_PASS: ''
        run: vendor/bin/phpunit

  smoke:
    name: Smoke test (live server)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql

      # Uses the runner's preinstalled MySQL (reachable via 'localhost', a
      # unix socket) rather than a services: container (TCP-only on
      # 127.0.0.1), because the app's own default config hardcodes
      # DB_HOST='localhost' — this exercises the exact code a real
      # deployment runs, no environment-variable overrides involved.
      - name: Start MySQL and match the app's default credentials
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '';" || true

      - name: Start the PHP built-in server
        run: |
          php -S 127.0.0.1:8000 >/tmp/php-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8000/login.php && break
            sleep 1
          done

      - name: Hit key pages and check they respond
        run: |
          set -e
          check() {
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000$1")
            echo "$1 -> $code (expected $2)"
            [ "$code" = "$2" ]
          }
          check /index.php 200
          check /login.php 200
          check /booking.php 200

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/php-server.log

  # Deploys to production over FTP after every check above passes on main.
  # Does nothing until the repo owner adds the FTP_SERVER, FTP_USERNAME, and
  # FTP_PASSWORD secrets themselves (Settings → Secrets and variables →
  # Actions) — see DEPLOYMENT.md. No credentials are stored here.
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [lint, test, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.FTP_USERNAME }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP_SERVER, FTP_USERNAME, and/or FTP_PASSWORD secrets are not set — skipping deploy. See DEPLOYMENT.md to enable automatic deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over FTP
        if: steps.check.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/tests/**
            **/vendor/**
            **/node_modules/**
            **/Apt PK/**
            composer.json
            composer.lock
            phpunit.xml
